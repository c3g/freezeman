# # FreezeMan fast restore on a slow disk
#
# This file overrides only the `command` of the `db` service. It starts PostgreSQL with settings that skip
# the disk flushes, so `pg_restore` or `psql` does not wait for the disk at each commit and checkpoint.
# Use it only when `pg_test_fsync` shows a low `fdatasync` rate (README.md: "Restore on a slow disk").
#
# SAFETY: use it only for a restore into a NEW, EMPTY `freezeman_pgdata` volume. If the host
# crashes or loses power while the volume runs with these settings, the data is corrupt. Then delete
# the volume and restore again. Never run the stack with this file after the restore.
#
#   podman-compose -f compose.yaml -f compose.restore.yaml up -d db
#   # ... restore the dump ...
#   podman-compose up -d --force-recreate db      # back to the settings of compose.yaml
#   sync                                          # on the host: write the files of the fast server to disk
#
# podman-compose replaces the `command` of `compose.yaml` with the one below. Check with
#   podman-compose -f compose.yaml -f compose.restore.yaml config

services:
  db:
    # The first flag is the `command` of compose.yaml (see the comment there). The other flags:
    # - fsync=off, synchronous_commit=off: do not wait for the disk at commit.
    # - full_page_writes=off: do not write full pages to the WAL after a checkpoint.
    # - wal_level=minimal: write only the WAL that crash recovery needs. A restore into a new volume
    #   needs no replication data. wal_level=minimal needs max_wal_senders=0.
    # - max_wal_size=8GB: fewer checkpoints during the load.
    # - maintenance_work_mem=512MB: faster index builds and constraint checks.
    command:
      - postgres
      - -c
      - log_timezone=${TZ:-America/Montreal}
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - max_wal_size=8GB
      - -c
      - maintenance_work_mem=512MB
