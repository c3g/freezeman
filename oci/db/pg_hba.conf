# Client authentication of the database (compose.yaml selects it with hba_file).
# PostgreSQL uses the first rule that matches a connection.
#
# The superuser postgres works only through the Unix socket in the db container
# (podman-compose exec db psql -U postgres). Its password is a known default (compose.yaml), so TCP
# must reject it. Django and dev connect over TCP as the app role of .env (POSTGRES_USER).

# TYPE  DATABASE  USER      ADDRESS  METHOD
local   all       all                trust
host    all       postgres  all      reject
host    all       all       all      scram-sha-256
