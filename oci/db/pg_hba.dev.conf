# Client authentication of the development database (compose.dev.yaml selects it with hba_file).
# PostgreSQL uses the first rule that matches a connection.
#
# The superuser postgres works only through the Unix socket in the db container
# (podman-compose exec db psql -U postgres), so no client outside the container controls the
# cluster. Django and dev connect over TCP as the app role of .env (POSTGRES_USER).

# TYPE  DATABASE  USER      ADDRESS  METHOD
local   all       all                trust
host    all       postgres  all      reject
host    all       all       all      scram-sha-256
