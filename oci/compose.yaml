# # FreezeMan production-like stack
#
# This file starts the services of FreezeMan: the database, Django and nginx. It also defines the
# `jobs` service (daily report, backup and log rotation) that host cron runs through jobs.py.
# Run `podman-compose` from this directory.
#
#   cd oci && cp .env.example .env   # then edit .env
#   podman-compose build
#   podman-compose up -d
#
# The default services include "web" (container nginx). The host nginx (HTTPS) passes the requests to
# 127.0.0.1:${FMS_HTTP_PORT} (see DEPLOYMENT.md, "Reverse proxy").
#
# Development: see compose.dev.yaml and DEVELOPMENT.md.
#
# After rebuilding images or editing .env, apply with
#   podman-compose up -d --force-recreate
# (plain `up -d` only recreates containers when this file's resolved config changes).

# Name the project. `name` is the prefix of the container, network and volume names (for example
# `freezeman_pgdata`).
name: freezeman

x-podman:
  # Use a plain bridge network with service-name DNS, like Kubernetes Services. Each service finds
  # the others by name (for example `db` and `backend`).
  # (Pods would also conflict with userns_mode in compose.dev.yaml.)
  in_pod: false

# A key that starts with `x-` is not a service. `&name` gives a block a name (an anchor), and
# `<<: *name` (a merge key) copies that block into a service. An anchor must be above its first use.

# Set the database settings of the Django services (`backend`, `jobs`).
x-backend-env: &backend-env
  PG_DATABASE: ${POSTGRES_DB}
  PG_USER: ${POSTGRES_USER}
  PG_PASSWORD: ${POSTGRES_PASSWORD}
  PG_HOST: db
  PG_PORT: "5432"
  TZ: ${TZ:-UTC}

# Proxy for the image builds (apt, pip, npm). Compose reads the shell first, then .env, so a
# developer without a proxy needs no setting. apt reads only the lowercase names. NO_PROXY always
# lists the service names, so traffic between the containers never goes through the proxy.
# Build arguments only: podman keeps the predefined proxy arguments out of the image.
# At runtime only "dev" (compose.dev.yaml) gets the proxy. The other services get no proxy
# (see x-no-proxy).
x-proxy: &proxy
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,web
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1},db,backend,web

# Runtime: no proxy. Podman copies the proxy of its own environment into each container
# (containers.conf http_proxy = true), and env_file gives the .env values. Empty values
# override both. Only "dev" (compose.dev.yaml) keeps the proxy.
x-no-proxy: &no-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  NO_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

services:
  # PostgreSQL 15 with the fzy extension.
  db:
    # Build the server image of oci/db/Containerfile (default target).
    image: localhost/freezeman-db:${FMS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: oci/db/Containerfile
      args:
        # apt-get installs the compiler and the PostgreSQL headers to build the fzy extension.
        <<: *proxy

    environment:
      <<: *no-proxy
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}

    # log_timezone is set in postgresql.conf when initdb first runs (UTC if TZ was unset then).
    # The flag overrides it for an existing data directory too.
    command: ["postgres", "-c", "log_timezone=${TZ:-UTC}"]

    # Keep the data in the named volume `pgdata`, so it stays after `down`, which removes the
    # container.
    volumes:
      # PostgreSQL 15 image: PGDATA is /var/lib/postgresql/data, declared as a VOLUME
      - pgdata:/var/lib/postgresql/data

    # Write the log of the container to ${FMS_LOG_DIR}/<service>.log on the host. Each service has
    # its own file. The file stays after `down` and `--force-recreate`, and `podman-compose logs`
    # still reads it. FMS_LOG_DIR has no default: set it in .env. The path must be absolute: a
    # relative path breaks `podman restart` from another directory. Do not use a nested default
    # such as ${A:-${B}}: podman-compose 1.5 (Rocky 9.6) stops at the first `}`.
    logging:
      driver: k8s-file
      options:
        path: ${FMS_LOG_DIR:?set FMS_LOG_DIR in .env to an absolute path}/db.log

    # Restart a container that exits while podman runs. It does not start containers at boot.
    # `start.py` does that (DEPLOYMENT.md: "Start at boot").
    restart: always

  # Django on uwsgi (the `CMD` of `backend-prod`). uwsgi listens on port 8000 (uwsgi protocol) in
  # the container network. The port is not published. Only `web` connects to it.
  #
  # Migrations are manual. Stop `web` and `backend`, start only `db`, then run
  #   podman-compose run --rm --no-deps backend sh -c "python /workspace/freezeman/backend/manage.py migrate --noinput && python /workspace/freezeman/backend/manage.py createinitialrevisions"
  # (a one-off container of this service, with the same image and settings). autoupdate.py runs it
  # on QC/dev hosts. See DEPLOYMENT.md.
  backend:
    image: localhost/freezeman-backend:${FMS_IMAGE_TAG:-latest}
    # Build the `backend-prod` image of oci/Containerfile. `jobs` builds on it.
    build:
      context: ..
      dockerfile: oci/Containerfile
      target: backend-prod
      args:
        # apt-get (libpq, gcc) and pip (requirements.txt, uwsgi) download packages.
        <<: *proxy

    env_file: .env
    environment:
      <<: [*backend-env, *no-proxy]
      # env_file also passes the host paths of the trigger and automations folders (volumes below)
      # to Django, which reads them as paths in the container. Set the fixed container paths, so
      # Django writes into the mounts.
      FMS_RUN_INFO_PATH: /workspace/freezeman/backend/triggers/lims-run-info
      FMS_VALIDATED_FILES_PATH: /workspace/freezeman/backend/triggers/lims-validation-info
      FMS_RELEASED_FILES_PATH: /workspace/freezeman/backend/triggers/lims-release-info
      FMS_AUTOMATIONS_WORK_PATH: /workspace/freezeman/backend/automations_work

    # keep-id: the files belong to the host user, as uid 1000 (the image user fms).
    # django owns the files on the host.
    userns_mode: keep-id:uid=1000,gid=1000

    # `:z` relabels the host directory for SELinux, so the container can use it. It has no effect
    # where SELinux is absent. Podman does not create a missing source directory, so create them
    # first (see the commands at the top).
    # The container paths are fixed. The variables of .env choose only the host folders, so
    # the files stay where they are on the host (for example the folders of a classic install).
    # Django uses only the three trigger folders, not their parent, so each one has its own mount.
    volumes:
      - ${FMS_MEDIA_DIR:-../backend/media}:/workspace/freezeman/backend/media:z
      - ${FMS_RUN_INFO_PATH:-../backend/triggers/lims-run-info}:/workspace/freezeman/backend/triggers/lims-run-info:z
      - ${FMS_VALIDATED_FILES_PATH:-../backend/triggers/lims-validation-info}:/workspace/freezeman/backend/triggers/lims-validation-info:z
      - ${FMS_RELEASED_FILES_PATH:-../backend/triggers/lims-release-info}:/workspace/freezeman/backend/triggers/lims-release-info:z
      - ${FMS_AUTOMATIONS_WORK_PATH:-../backend/automations_work}:/workspace/freezeman/backend/automations_work:z

    # Start as soon as the `db` container starts. The entrypoint of the image waits until the
    # database accepts connections.
    depends_on:
      db:
        condition: service_started

    logging:
      driver: k8s-file
      options:
        path: ${FMS_LOG_DIR:?set FMS_LOG_DIR in .env to an absolute path}/backend.log

    restart: always

  # nginx in a container: the production entry. The host nginx passes HTTP to it.
  # Also the model for Kubernetes. It serves the frontend build, the Django static files and
  # `/media/`, and passes `/api/` to `backend`.
  web:
    # Build the `web` image of oci/Containerfile.
    image: localhost/freezeman-web:${FMS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: oci/Containerfile
      target: web
      args:
        # apt-get (git) and npm ci download packages for the frontend build that web copies.
        <<: *proxy
        FMS_ENV: ${FMS_ENV:?set FMS_ENV in .env (PROD, QC or DEV)}

    environment:
      <<: *no-proxy
      BACKEND_UPSTREAM: backend:8000
      TZ: ${TZ:-UTC}

    # Publish port 8080 of the container on the host.
    # Only the host nginx can reach it. A developer in a VM or container sets FMS_HTTP_ADDR=0.0.0.0.
    ports:
      - "${FMS_HTTP_ADDR:-127.0.0.1}:${FMS_HTTP_PORT:-8080}:8080"

    # `:ro` makes the mount read-only, because nginx only reads the media files. `:z` is the
    # SELinux label (see `backend`).
    volumes:
      - ${FMS_MEDIA_DIR:-../backend/media}:/workspace/freezeman/backend/media:ro,z

    # nginx exits if "backend" does not resolve at startup; the condition starts "backend" first,
    # and restart: always is the fallback if the name does not resolve yet.
    depends_on:
      backend:
        condition: service_started

    logging:
      driver: k8s-file
      options:
        path: ${FMS_LOG_DIR:?set FMS_LOG_DIR in .env to an absolute path}/web.log

    restart: always

  # The image of the three daily jobs. Host cron runs one job per crontab line with jobs.py, which
  # calls `podman-compose --profile jobs run --rm jobs <command> now` (DEPLOYMENT.md, "Daily jobs"):
  #   fms-report      prepare_report_data (a CronJob in Kubernetes)
  #   fms-backup      pg_dumpall into FMS_BACKUP_DIR as <YYYY-MM-DD>.pgsql.gz (a CronJob in Kubernetes)
  #   fms-logrotate   logrotate of FMS_LOG_DIR/*.log. Kubernetes needs no such job: the cluster
  #                   rotates the container logs.
  # The crontab line redirects the output to ${FMS_LOG_DIR}/jobs.log.
  jobs:
    # Only `podman-compose run` starts it. `up -d` does not.
    profiles: ["jobs"]

    # Build the `jobs` image of oci/Containerfile (`backend-prod` plus
    # postgresql-client-15 and logrotate).
    image: localhost/freezeman-jobs:${FMS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: oci/Containerfile
      target: jobs
      args:
        # apt-get (PostgreSQL client, logrotate) downloads packages.
        <<: *proxy

    # No env_file: the container gets only what the three jobs need. `report` runs Django, so it
    # needs the Django settings below. `backup` reads PG_* (x-backend-env).
    environment:
      <<: [*backend-env, *no-proxy]
      FMS_SECRET_KEY: ${FMS_SECRET_KEY}
      FMS_ENV: ${FMS_ENV:?set FMS_ENV in .env (PROD, QC or DEV)}
      FMS_DEBUG: ${FMS_DEBUG:-False}
      FMS_HOST: ${FMS_HOST:-}
      # A key with no value passes the value of .env, and leaves the variable unset if .env has
      # none. Do not write `${FMS_EMAIL_HOST:-}` here: an empty value counts as set for Django
      # (settings.py: an empty FMS_EMAIL_HOST turns on SMTP, an empty FMS_EMAIL_PORT stops `int()`).
      FMS_EMAIL_HOST:
      FMS_EMAIL_PORT:
      FMS_EMAIL_FROM:
      FMS_EMAIL_USER:
      FMS_EMAIL_PASSWORD:
      FMS_EMAIL_TLS:
      FMS_BACKUP_KEEP_DAYS: ${FMS_BACKUP_KEEP_DAYS:-14}
      FMS_LOGROTATE_FREQUENCY: ${FMS_LOGROTATE_FREQUENCY:-weekly}
      FMS_LOGROTATE_KEEP: ${FMS_LOGROTATE_KEEP:-8}

    # keep-id: the jobs run as uid 1000 (the image user fms), which is the host user. The log,
    # backup and report files keep the host owner, like `backend`.
    userns_mode: keep-id:uid=1000,gid=1000

    # `:z` is the SELinux label (see `backend`). FMS_LOG_DIR is mounted twice: /logs is the
    # directory that logrotate rotates, and ~/reports/log is where prepare_report_data writes
    # report_preparation.log, next to the service logs (<service>.log). The backup directory must
    # exist.
    volumes:
      - ${FMS_LOG_DIR:?set FMS_LOG_DIR in .env to an absolute path}:/logs:z
      - ${FMS_LOG_DIR:?set FMS_LOG_DIR in .env to an absolute path}:/home/fms/reports/log:z
      - ${FMS_BACKUP_DIR:-./backups}:/backups:z

    # Start as soon as the `db` container starts. The entrypoint of the image waits until the
    # database accepts connections.
    depends_on:
      db:
        condition: service_started

    # One run per call: the next crontab line starts a new container.
    restart: "no"

# Declare the named volume of `db`. Podman manages it, so the data stays when a container is
# removed.
volumes:
  pgdata:
