# Development override: source bind-mounted from the host, Django runserver
# and webpack-dev-server with live reload. Works with podman-compose on any OS
# (on macOS/Windows inside `podman machine`).
#
#   podman-compose -f compose.yaml -f compose.dev.yaml up
#
# Frontend: http://localhost:9000   Backend: http://localhost:8000
#
# The repository is mounted at /src so backend/fms/info.py and
# frontend/webpack.config.js find ../VERSION and .git as they do outside
# containers. ":z" relabels the mounts for SELinux (Rocky/RHEL/Fedora) and is
# ignored elsewhere. userns_mode: keep-id keeps files written into the
# repository (fms.log, migrations, uploads) owned by the host user.

x-dev-backend: &dev-backend
  image: localhost/freezeman-backend-dev:latest
  environment:
    FMS_ENV: LOCAL
    FMS_DEBUG: "True"
  userns_mode: keep-id
  restart: "no"

services:
  db:
    ports:
      - "5432:5432"

  migrate:
    <<: *dev-backend
    build:
      target: backend-dev
    volumes:
      - ..:/src:z

  backend:
    # compose.yaml adds FMS_UWSGI_SOCKET, the /run/fms mount and label=disable for the host nginx.
    # runserver ignores them, so they stay.
    <<: *dev-backend
    volumes:
      - ..:/src:z
      # Replace the named volumes from compose.yaml with the repository directories
      - ../backend/media:/src/backend/media:z
      - ../backend/triggers:/src/backend/triggers:z
      - ../backend/automations_work:/src/backend/automations_work:z
    ports:
      - "8000:8000"
      # Published here because the frontend shares this network namespace
      - "9000:9000"
    healthcheck:
      disable: true

  frontend:
    image: localhost/freezeman-frontend-dev:latest
    build:
      context: ..
      dockerfile: oci/Containerfile
      target: frontend-dev
    environment:
      FMS_ENV: LOCAL
      # The keep-id user's home directory does not exist in the image
      NPM_CONFIG_CACHE: /tmp/.npm
    userns_mode: keep-id
    volumes:
      - ..:/src:z
      # Linux dependencies installed by the container, separate from the host's node_modules
      # (":U" chowns the volume to the container user)
      - frontend_node_modules:/src/frontend/node_modules:U
    # Shares the backend network namespace, so webpack reaches the API at
    # localhost:8000 as outside containers (webpack.config.js is unchanged).
    network_mode: "service:backend"
    depends_on:
      - backend
    restart: "no"

  assets:
    # The host nginx files are not copied in development.
    profiles: ["prod"]

  web:
    # The production nginx image is not used in development.
    profiles: ["prod"]

  report:
    # The daily report job does not run in development.
    profiles: ["report"]

  backup:
    # The daily database backup does not run in development.
    profiles: ["backup"]

volumes:
  frontend_node_modules:
