# # FreezeMan development override
#
# This file changes compose.yaml for development. It adds one idle "dev" container with Python 3.14
# (venv) and Node 24, and the source bind-mounted from the host. It starts no server. Enter it and
# start runserver, npm start and migrate by hand. Works with podman-compose on any OS (on
# macOS/Windows inside `podman machine`).
#
#   podman-compose -f compose.yaml -f compose.dev.yaml up -d
#   podman-compose -f compose.yaml -f compose.dev.yaml exec dev bash
#
# Frontend: http://localhost:9000   Backend: http://localhost:8000

# Same proxy block as compose.yaml (YAML anchors do not cross files). It also reaches the
# environment of "dev", so npm ci and pip run through the proxy when compose starts without
# the shell proxy.
x-proxy: &proxy
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,web
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1},db,backend,web

services:
  db:
    # pytest creates its own test database, so the app role gets CREATEDB (db/initdb/20-app-role.sh).
    environment:
      FMS_DB_CREATEDB: "true"

    # Compose replaces `command` of compose.yaml, so the log_timezone and hba_file flags are repeated.
    # max_locks_per_transaction: pytest-xdist workers migrate their test databases at the same
    # time, and migration 0055 changes 46 primary keys in one transaction. The default shared lock
    # table (64 × max_connections) is too small and PostgreSQL stops with "out of shared memory".
    # Cost: about 14 MB of shared memory. PostgreSQL 18 also fixes the problem with the defaults:
    # its fast-path lock slots per connection scale with max_locks_per_transaction, so fewer locks
    # use the shared table. On PostgreSQL 18 or later, the flag is probably not necessary.
    command: ["postgres", "-c", "log_timezone=${TZ:-UTC}", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "max_locks_per_transaction=512"]

    # Publish the database port, so a host `psql` or a GUI client can connect to
    # `localhost:<HOST_DB_PORT>`. The port in the container network stays 5432.
    ports:
      - "${HOST_DB_PORT:-5432}:5432"

  # The development container. It runs `sleep infinity` (the `CMD` of the `dev` target). In it,
  # the developer runs `migrate`, `runserver` and `npm start` by hand, in place of the production
  # services `backend` and `web` (see DEVELOPMENT.md).
  dev:
    # Build the `dev` image of oci/Containerfile.
    image: localhost/freezeman-dev:latest
    build:
      context: ..
      dockerfile: oci/Containerfile
      target: dev
      args:
        # apt-get (git, psql client), pip and npm download packages while the image builds.
        <<: *proxy
        # Path of the project in the container (x-build-root of compose.yaml).
        CONTAINER_FMS_ROOT: ${CONTAINER_FMS_ROOT:-/workspace/freezeman}

    # No env_file, so the HOST_* settings of .env never reach the container. The Django settings
    # repeat x-django-env of compose.yaml (YAML anchors do not cross files).
    # No FMS_RUN_INFO_PATH and similar: the Django defaults are in the repository mount.
    environment:
      <<: *proxy
      FMS_ENV: LOCAL
      FMS_DEBUG: "True"
      # No value: if .env has no FMS_SECRET_KEY, the variable stays unset and Django uses the
      # development key of settings.py. An empty value would stop Django.
      FMS_SECRET_KEY:
      FMS_HOST: ${FMS_HOST:-}
      # Django writes fms.log in the mount of HOST_LOG_DIR below.
      FMS_LOG_DIR: /var/log/fms
      # A key with no value passes the value of .env, and leaves the variable unset if .env has
      # none (see x-django-env in compose.yaml).
      FMS_EMAIL_HOST:
      FMS_EMAIL_PORT:
      FMS_EMAIL_FROM:
      FMS_EMAIL_USER:
      FMS_EMAIL_PASSWORD:
      FMS_EMAIL_TLS:
      TZ: ${TZ:-UTC}
      PG_DATABASE: ${POSTGRES_DB:-fms}
      PG_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_HOST: db
      PG_PORT: "5432"
      # psql in this container reads these (DEVELOPMENT.md: "Database access")
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-fms}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD}

    # Run the container as the host user. keep-id keeps files written into the repository
    # (fms.log, migrations, uploads) owned by the host user.
    userns_mode: keep-id

    volumes:
      # Mount the repository at CONTAINER_FMS_ROOT, so backend/fms/info.py and
      # frontend/webpack.config.js find ../VERSION and .git as they do outside containers.
      # backend/media, backend/triggers and backend/automations_work are in this mount, so they
      # need no mount of their own.
      - type: bind
        source: ..
        target: ${CONTAINER_FMS_ROOT:-/workspace/freezeman}
        bind:
          selinux: z
          create_host_path: true
      # Linux dependencies installed by the container, separate from the host's node_modules.
      # Rootless podman creates the volume as the host user, and keep-id maps the host user to
      # the container user, so `npm ci` can write to it.
      - type: volume
        source: frontend_node_modules
        target: ${CONTAINER_FMS_ROOT:-/workspace/freezeman}/frontend/node_modules
      - type: bind
        source: ${HOST_LOG_DIR:?set HOST_LOG_DIR in .env to an absolute path}
        target: /var/log/fms
        bind:
          selinux: z
          create_host_path: true

    # Publish runserver (8000) and the webpack dev server (9000) on the host.
    ports:
      - "8000:8000"
      - "9000:9000"

    logging:
      driver: k8s-file
      options:
        path: ${HOST_LOG_DIR:?set HOST_LOG_DIR in .env to an absolute path}/dev.log

    # The entrypoint waits until the database accepts connections.
    depends_on:
      db:
        condition: service_started

    restart: "no"

    # sleep runs as PID 1 and ignores SIGTERM, so `podman stop` waits for SIGKILL and an
    # interrupted stop leaves the container in "Stopping". catatonit (PID 1) forwards the signal.
    init: true

  # Turn off the production services. A service with a `profiles` list starts only when the
  # profile is active, so `up -d` does not start these services.
  backend:
    # The developer runs migrate and runserver by hand in "dev".
    profiles: ["prod"]

  web:
    # The production nginx image is not used in development.
    profiles: ["prod"]

# Declare the volume for the Linux `node_modules` of `dev`.
volumes:
  frontend_node_modules:
