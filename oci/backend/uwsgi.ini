[uwsgi]
chdir = /src/backend
module = fms.wsgi:application
master = true
# processes comes from UWSGI_PROCESSES (uwsgi reads UWSGI_* variables as options)
# uwsgi protocol for nginx (uwsgi_pass), replaces the unix socket fms.sock
socket = :8000
# Plain HTTP for healthchecks and Kubernetes probes only, not published
http-socket = :8001
# uwsgi 2.0 reloads on SIGTERM. Containers stop with SIGTERM, so exit instead.
die-on-term = true
need-app = true
