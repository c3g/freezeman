[uwsgi]
# Values match the classic production uwsgi.ini, except the socket, the paths and the log files:
# compose sets the paths and keeps the container log.
# CONTAINER_FMS_ROOT: the project path, an ENV of the image
chdir = $(CONTAINER_FMS_ROOT)/backend
module = fms.wsgi:application
master = true
# processes comes from UWSGI_PROCESSES (uwsgi reads UWSGI_* variables as options)
cpu-affinity = 1
enable-threads = true
# uwsgi protocol for the web nginx (uwsgi_pass) in the container network
socket = :8000
# uwsgi 2.0 reloads on SIGTERM. Containers stop with SIGTERM, so exit instead.
die-on-term = true
need-app = true

# Worker names in `ps`, also on the host: |FMS| uWSGI worker 1, ...
auto-procname = true
procname-prefix = |FMS|

# Read with: podman exec <backend container> uwsgi --connect-and-read /tmp/fms-stats.sock
stats = /tmp/fms-stats.sock

# uwsgi writes request times in the process time zone, which Django sets to UTC (TIME_ZONE).
# The web nginx access log has each request in TZ, so uwsgi logs only the failed requests.
disable-logging = true
log-4xx = true
log-5xx = true

# Large request headers (cookies, tokens). The default is 4096.
buffer-size = 16384
