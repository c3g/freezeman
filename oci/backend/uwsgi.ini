[uwsgi]
chdir = /src/backend
module = fms.wsgi:application
master = true
# processes comes from UWSGI_PROCESSES (uwsgi reads UWSGI_* variables as options)
# uwsgi protocol for nginx (uwsgi_pass) in the container network and Kubernetes
socket = :8000
# Host nginx (DEPLOYMENT.md) passes /api/ to a unix socket. compose.yaml sets
# FMS_UWSGI_SOCKET. The nginx user is not the owner, so it needs write access.
if-env = FMS_UWSGI_SOCKET
socket = %(_)
chmod-socket = 666
vacuum = true
endif =
# Plain HTTP for healthchecks and Kubernetes probes only, not published
http-socket = :8001
# uwsgi 2.0 reloads on SIGTERM. Containers stop with SIGTERM, so exit instead.
die-on-term = true
need-app = true
